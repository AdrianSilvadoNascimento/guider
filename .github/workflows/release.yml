name: Release

# Pushing the tag is the trigger, not a manual bump, because `main` requires a
# pull request — a workflow can't push a version commit to it. The flow is:
# bump `version` in package.json via PR, merge, then tag the merge commit.
#
# workflow_dispatch exists for recovery: it runs *this* file from the default
# branch against an already-published tag's code, which is the only way to
# re-release a tag that was cut before a pipeline fix landed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. v1.3.0"
        required: true

permissions:
  contents: write # create the release and upload guider.skill
  id-token: write # the OIDC token npm trusted publishing exchanges for a credential

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, release and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Deliberately no `registry-url`: that option makes setup-node write an
      # .npmrc pinning _authToken to $NODE_AUTH_TOKEN, and an empty value there
      # shadows the OIDC credential and fails the publish with ENEEDAUTH.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Node 22 bundles npm 10, which predates trusted publishing. Checked here,
      # before anything is built or published, so a too-old npm can't strand the
      # release half-done.
      - name: npm must support trusted publishing
        run: |
          npm install -g npm@latest
          need="11.5.1"
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n 1)" != "$need" ]; then
            echo "::error::npm ${have} cannot use trusted publishing (need >= ${need})."
            exit 1
          fi
          echo "npm ${have} supports trusted publishing."

      - run: npm ci

      # A tag that disagrees with package.json would ship a release asset under
      # one version and an npm package under another. Fail before anything is
      # published rather than after.
      - name: Tag must match package.json version
        run: |
          want="${TAG#v}"
          pkg="$(npm pkg get version | tr -d '"')"
          if [ "$want" != "$pkg" ]; then
            echo "::error::Tag ${TAG} implies version ${want}, but package.json says ${pkg}."
            exit 1
          fi

      - run: npm run lint

      - run: npm test

      - name: Build the skill asset
        id: build
        run: |
          npm run build
          echo "sha256=$(sha256sum dist/guider.skill | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # The CLI resolves a release through the API and downloads the asset named
      # `guider.skill`; a release without it fails every install/update, so this
      # step is the one that must not be skipped.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — replacing its asset."
            gh release upload "$TAG" dist/guider.skill --clobber
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body > notes.md
            {
              echo
              echo "## Pinning this release"
              echo
              echo '```bash'
              echo "npx @adrianfsf/guider skills install guider --tag ${TAG} --sha256 ${SHA256}"
              echo '```'
            } >> notes.md
            gh release create "$TAG" dist/guider.skill \
              --title "$TAG" --notes-file notes.md
          fi

      # Split from the release step so that re-running a failed npm publish
      # doesn't depend on re-creating the release, and vice versa.
      # No token: npm exchanges this job's OIDC identity for a short-lived
      # credential, which requires a trusted publisher configured on npmjs.com
      # for this repo AND this workflow filename. Provenance comes with it, so
      # --provenance is not passed explicitly.
      - name: Publish to npm
        run: |
          name="$(npm pkg get name | tr -d '"')"
          version="$(npm pkg get version | tr -d '"')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm — skipping publish."
          else
            npm publish --access public
          fi
